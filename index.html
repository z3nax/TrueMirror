<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Mirror Camera with Permission Handling</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            overflow: hidden;
            border-radius: 20px;
            background: #1c1c1e;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
            display: none; /* Hidden until permission granted */
        }

        .overlay-ui {
            position: absolute;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        button {
            background-color: #007aff; /* iOS Blue */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #0056b3;
        }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: #aeaeb2;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        
        <div id="permissionUI" class="overlay-ui">
            <button id="startBtn">Enable Camera</button>
            <p id="statusMsg" class="status-text">This app requires camera access to show your reflection.</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const permissionUI = document.getElementById('permissionUI');
        const startBtn = document.getElementById('startBtn');
        const statusMsg = document.getElementById('statusMsg');

        async function requestCameraPermission() {
            const constraints = {
                video: {
                    facingMode: 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            statusMsg.innerText = "Requesting permission...";

            try {
                // This triggers the native iOS "Allow/Deny" popup
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // If successful, attach stream and swap UI
                video.srcObject = stream;
                video.style.display = 'block';
                permissionUI.style.display = 'none'; 
                
            } catch (err) {
                console.error("Camera error:", err);
                handlePermissionError(err);
            }
        }

        function handlePermissionError(error) {
            // Check specifically for rejection or blockages
            if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                statusMsg.innerHTML = "❌ <strong>Camera Access Denied</strong>.<br><br>To fix this:<br>1. Tap the <strong>'aA'</strong> icon in Safari's address bar.<br>2. Tap <strong>Website Settings</strong>.<br>3. Change Camera to <strong>Allow</strong>, then refresh.";
            } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                statusMsg.innerText = "❌ Front camera not found on this device.";
            } else {
                statusMsg.innerText = "❌ Could not access camera. Please make sure you are using Safari on iOS.";
            }
            // Keep button visible so they can try again after changing settings
            startBtn.innerText = "Try Again";
        }

        // iOS Safari strictly prefers media requests triggered by a direct user gesture (click/tap)
        startBtn.addEventListener('click', requestCameraPermission);
    </script>
</body>
</html>
